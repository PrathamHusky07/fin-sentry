# Day 8 horizontal-scale demo: round-robin (nginx's default, no directive
# needed) across three explicit gateway replicas. Explicit server names
# (not a single scaled service + dynamic DNS) so each upstream is resolved
# once at nginx startup and is unambiguous in logs and in the failover demo.
events {}

http {
    upstream gateway_upstream {
        server gateway-1:8000;
        server gateway-2:8000;
        server gateway-3:8000;
    }

    server {
        listen 80;

        # SSE-aware: buffering off (nginx buffers proxied responses by
        # default, which would hold every frame until the buffer fills --
        # defeating a live stream), a long read timeout (the connection is
        # meant to stay open indefinitely), and keep-alive to the upstream
        # preserved rather than closed per request.
        location /ops/stream {
            proxy_pass http://gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding off;
        }

        location / {
            proxy_pass http://gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
