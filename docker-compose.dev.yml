services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: finsentry-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finsentry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finsentry"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redpanda:
    image: redpandadata/redpanda:v26.2.2
    container_name: finsentry-redpanda
    command:
      - redpanda
      - start
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - "9092:9092"
      - "9644:9644"
      - "8081:8081"
      - "8082:8082"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  risingwave:
    image: risingwavelabs/risingwave:v3.0.3
    container_name: finsentry-risingwave
    command: playground
    ports:
      - "4566:4566"
      - "5691:5691"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/4566' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  redpanda_data:
