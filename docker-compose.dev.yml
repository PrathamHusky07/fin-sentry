services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: finsentry-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finsentry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finsentry"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redpanda:
    image: redpandadata/redpanda:v26.2.2
    container_name: finsentry-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --default-log-level=warn
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr=INTERNAL://redpanda:9092,EXTERNAL://localhost:19092
      - --pandaproxy-addr=INTERNAL://0.0.0.0:8082,EXTERNAL://0.0.0.0:18082
      - --advertise-pandaproxy-addr=INTERNAL://redpanda:8082,EXTERNAL://localhost:18082
    ports:
      - "9092:9092"
      - "19092:19092"
      - "9644:9644"
      - "8082:8082"
      - "18082:18082"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  risingwave:
    image: risingwavelabs/risingwave:v3.0.3
    container_name: finsentry-risingwave
    # `playground` is a documented shortcut for `single-node --in-memory`
    # ("should not be used in production", per the binary's own --help) --
    # its meta store and object store are both in-memory, so a restart
    # wipes every source/materialized-view definition and all data.
    # `single_node` (the binary's actual default mode) with an explicit
    # --store-directory persists both to the mounted volume below.
    command: single_node --store-directory /risingwave/state
    ports:
      - "4566:4566"
      - "5691:5691"
    volumes:
      - risingwave_data:/risingwave/state
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/4566' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------
  # Day 8: horizontal-scale demo. dashboard/metrics stays a single internal
  # service (Option C: it is the only thing that owns RisingWave); three
  # explicit gateway replicas behind nginx prove the gateway's own stateless
  # horizontal scalability and failover, which is the thing Day 8 claims.
  # ---------------------------------------------------------------------

  dashboard:
    build:
      context: .
      dockerfile: finsentry/dashboard/Dockerfile
    container_name: finsentry-dashboard
    environment:
      RISINGWAVE_HOST: risingwave
      KAFKA_MODE: disabled
    depends_on:
      risingwave:
        condition: service_healthy
    expose:
      - "8081"

  gateway-1: &gateway
    build:
      context: .
      dockerfile: finsentry/gateway/Dockerfile
    image: fin-sentry-gateway:latest
    container_name: finsentry-gateway-1
    environment: &gateway-env
      GATEWAY_INSTANCE_ID: gateway-1
      METRICS_SERVICE_URL: http://dashboard:8081
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/finsentry
      # Ollama runs on the host, not in this compose network.
      DOWNSTREAM_URL: http://host.docker.internal:11434
      DOWNSTREAM_MODEL: llama3.1:8b
      # Disabled for this demo, deliberately: real Gemini/Kafka calls would
      # either cost money or write synthetic failover-test traffic into the
      # same persisted event history Day 6/7's real calibration data lives
      # in. The nginx/SSE/failover proof doesn't need either.
      GEMINI_MODE: disabled
      KAFKA_MODE: disabled
      OTEL_EXPORTER: none
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      dashboard:
        condition: service_started
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  gateway-2:
    <<: *gateway
    container_name: finsentry-gateway-2
    environment:
      <<: *gateway-env
      GATEWAY_INSTANCE_ID: gateway-2

  gateway-3:
    <<: *gateway
    container_name: finsentry-gateway-3
    environment:
      <<: *gateway-env
      GATEWAY_INSTANCE_ID: gateway-3

  nginx:
    image: nginx:1.27-alpine
    container_name: finsentry-nginx
    volumes:
      - ./infra/nginx/gateway.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8088:80"
    depends_on:
      - gateway-1
      - gateway-2
      - gateway-3

volumes:
  postgres_data:
  redpanda_data:
  risingwave_data: