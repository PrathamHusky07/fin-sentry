[project]
name = "fin-sentry"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["finsentry"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = [
    "edgar.*",
    "datasets.*",
    "sentence_transformers.*",
    "langchain_text_splitters.*",
    "pgvector.*",
    "nemoguardrails.*",
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
    "spacy.*",
    "bitsandbytes.*",
    "accelerate.*",
    "google.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy stubs use Python 3.12+ `type` statement syntax; kept to suppress any
# version-specific stub-parse errors that surface under future numpy releases.
module = ["numpy", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests that download or load large models (deselect with -m 'not slow')",
]
