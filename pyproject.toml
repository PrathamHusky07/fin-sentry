[project]
name = "fin-sentry"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp>=2.3.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.format]
# Baseline for `ruff format --check .` in CI. At the commit that added the CI workflow, ruff format
# reported these 78 files. The differences sampled are lines re-wrapped to fit the 100 column limit.
# They are legacy code in the rails, judges, frontier and reliability packages and their tests, and
# reformatting them was kept out of the CI change. Every other file must be formatted, so the list can
# only shrink: to retire an entry, run `ruff format <file>` on it and delete its line.
exclude = [
    "finsentry/calibration/metrics.py",
    "finsentry/calibration/split.py",
    "finsentry/consumer/frontier_consumer.py",
    "finsentry/consumer/lag_monitor.py",
    "finsentry/consumer/main.py",
    "finsentry/consumer/rag_event_consumer.py",
    "finsentry/events/producer.py",
    "finsentry/events/schema.py",
    "finsentry/events/topics.py",
    "finsentry/frontier/adapters/gemini_rubric_adapter.py",
    "finsentry/frontier/adapters/hhem_adapter.py",
    "finsentry/frontier/ensemble.py",
    "finsentry/frontier/faithjudge/retriever.py",
    "finsentry/frontier/faithjudge/types.py",
    "finsentry/frontier/orchestrator.py",
    "finsentry/frontier/prompts/rubric_v1.py",
    "finsentry/frontier/prompts/rubric_v2_faithjudge.py",
    "finsentry/frontier/protocol.py",
    "finsentry/frontier/types.py",
    "finsentry/gateway/circuit_breaker.py",
    "finsentry/ingestion/finqa_hallucination.py",
    "finsentry/ingestion/sec_edgar.py",
    "finsentry/judges/flash_judge.py",
    "finsentry/judges/metrics/answer_relevance.py",
    "finsentry/judges/metrics/context_relevance.py",
    "finsentry/judges/metrics/faithfulness_core.py",
    "finsentry/observability/tracing.py",
    "finsentry/rails/base.py",
    "finsentry/rails/input/llama_guard.py",
    "finsentry/rails/output/_dev_cache.py",
    "finsentry/rails/output/cost_governance.py",
    "finsentry/rails/output/faithfulness.py",
    "finsentry/rails/output/guardrails_schema.py",
    "finsentry/rails/output/regulated_phrases.py",
    "finsentry/rails/retrieval/rail.py",
    "finsentry/rails/retrieval/source_trust.py",
    "finsentry/reliability/audit.py",
    "finsentry/reliability/canary.py",
    "finsentry/reliability/controller.py",
    "finsentry/reliability/gated_judge.py",
    "finsentry/reliability/health.py",
    "finsentry/risingwave/dao.py",
    "tests/consumer/test_lag_monitor.py",
    "tests/consumer/test_offset_commit.py",
    "tests/consumer/test_rag_event_consumer.py",
    "tests/dashboard/test_dashboard_app.py",
    "tests/dashboard/test_frontier_endpoint.py",
    "tests/dashboard/test_risingwave_failure_contract.py",
    "tests/events/test_producer.py",
    "tests/events/test_schema.py",
    "tests/frontier/test_evidence_contract.py",
    "tests/frontier/test_types.py",
    "tests/gateway/test_circuit_breaker.py",
    "tests/gateway/test_output_rails_integration.py",
    "tests/gateway/test_rag_endpoint.py",
    "tests/gateway/test_rag_event_emission.py",
    "tests/gateway/test_rag_root_span.py",
    "tests/gateway/test_rails.py",
    "tests/ingestion/test_sec_edgar.py",
    "tests/integration/test_frontier_consumer.py",
    "tests/judges/metrics/test_answer_relevance.py",
    "tests/judges/metrics/test_context_relevance.py",
    "tests/judges/metrics/test_faithfulness_core.py",
    "tests/judges/test_flash_judge.py",
    "tests/observability/test_tracing.py",
    "tests/rails/input/test_prompt_guard_chunking.py",
    "tests/rails/output/test_cost_governance.py",
    "tests/rails/output/test_dev_cache.py",
    "tests/rails/output/test_faithfulness.py",
    "tests/rails/output/test_guardrails_schema.py",
    "tests/rails/output/test_regulated_phrases.py",
    "tests/rails/output/test_schema.py",
    "tests/rails/retrieval/test_rail.py",
    "tests/rails/retrieval/test_source_trust.py",
    "tests/reliability/test_controller.py",
    "tests/reliability/test_gated_judge.py",
    "tests/scripts/test_init_risingwave.py",
    "tests/scripts/test_smoke_test_infra.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["finsentry"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = [
    "edgar.*",
    "datasets.*",
    "sentence_transformers.*",
    "langchain_text_splitters.*",
    "pgvector.*",
    "nemoguardrails.*",
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
    "spacy.*",
    "bitsandbytes.*",
    "accelerate.*",
    "google.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy stubs use Python 3.12+ `type` statement syntax; kept to suppress any
# version-specific stub-parse errors that surface under future numpy releases.
module = ["numpy", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests that download or load large models (deselect with -m 'not slow')",
    "integration: marks tests that require live Docker infrastructure (Redpanda/RisingWave) or the SEC corpus ingested into Postgres — run explicitly with -m integration",
    "live_topics: publishes a successful event to the live rag-responses topic, where the running consumers judge it with a real Gemini call. Skipped unless --run-live-topic-tests is passed",
]
