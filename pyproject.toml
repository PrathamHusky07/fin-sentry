[project]
name = "fin-sentry"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["finsentry"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = [
    "edgar.*",
    "datasets.*",
    "sentence_transformers.*",
    "langchain_text_splitters.*",
    "pgvector.*",
    "nemoguardrails.*",
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
    "spacy.*",
    "bitsandbytes.*",
    "accelerate.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy stubs use Python 3.12 `type` statement syntax, incompatible with mypy
# targeting 3.11. This override prevents the stub-parse error from blocking analysis.
module = ["numpy", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
