# Deterministic gates only. Nothing here calls a model, starts a stream service or runs the RAG
# endpoint, and no job reads a secret. The live stack, Gemini, calibration, Red Team and Agent
# runs stay a separate manual path (docs/deploy-readiness.md, "Continuous integration").
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff, mypy, deterministic pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The test suite runs the migrations against Postgres before any test (tests/conftest.py), so
    # every pytest run needs one. This is a throwaway container with a throwaway password.
    # Redpanda, RisingWave, Ollama and the gateway are deliberately absent.
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finsentry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finsentry_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13" # pyproject.toml: requires-python >=3.13,<3.14
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        # The CPU build of torch first, so pip does not pull the CUDA wheels that sentence-transformers
        # would otherwise bring. ruff and mypy are pinned to the versions the gates were checked with.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt "ruff==0.16.6" "mypy==2.3.1"
          python -m spacy download en_core_web_sm
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        # pyproject.toml lists the legacy files this check skips ([tool.ruff.format] exclude).
        run: ruff format --check .
      - name: mypy
        run: mypy finsentry/
      - name: pytest (deterministic subset)
        # Deselected: slow (downloads or loads a model) and integration (needs Redpanda, RisingWave
        # or the ingested SEC corpus). Ignored: tests/ingestion, which downloads Hugging Face
        # datasets and an embedding model and needs live SEC EDGAR access. HF_HUB_OFFLINE makes any
        # unexpected model download fail loudly instead of running.
        run: python -m pytest -q -rfs -m "not slow and not integration" --ignore=tests/ingestion
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finsentry_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finsentry_test
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"

  frontend:
    name: Frontend (tsc, eslint, vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generate route types
        # RouteContext and LayoutProps are generated by Next. Without this, tsc fails on a clean
        # checkout. See node_modules/next/dist/docs/01-app/03-api-reference/06-cli/next.md.
        run: npx next typegen
      - name: tsc
        run: npx tsc --noEmit
      - name: eslint
        run: npm run lint
      - name: vitest
        run: npm test

  archive-mode:
    name: Archive mode (production build and offline Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build archived-evidence mode
        # Reads the committed docs/demo-archive next to web/. The gateway URL is a closed port.
        run: npm run build:archive
      - name: Serve the build and run the archive Playwright project
        # The archive project needs no backend: every request must stay on localhost:3100.
        run: |
          npm run start:archive > "$RUNNER_TEMP/archive-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3100/overview && break
            sleep 1
          done
          npm run test:e2e:archive
      - name: Server log
        # Diagnostic only. The file does not exist when the build failed before the server started.
        if: failure()
        run: '[ ! -f "$RUNNER_TEMP/archive-server.log" ] || cat "$RUNNER_TEMP/archive-server.log"'
